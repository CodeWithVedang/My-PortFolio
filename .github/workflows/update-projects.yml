name: Update Portfolio Projects

on:
  schedule:
    - cron: "30 4 * * *" # 10 AM IST = 4:30 AM UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        env:
          GOOGLE_SHEET_CREDENTIALS: ${{ secrets.GOOGLE_SHEET_CREDENTIALS }}
          G_TOKEN: ${{ secrets.G_TOKEN }}
        run: python update_projects.py

      - name: Commit and push changes
        run: |
          git config --global user.name "CodeWithVedang"
          git config --global user.email "shelatkarvedang2@gmail.com"
          git add index.html myprojects.html
          git commit -m "Automated project section update" || echo "No changes to commit"
          git remote set-url origin https://CodeWithVedang:${{ secrets.G_TOKEN }}@github.com/CodeWithVedang/My-PortFolio.git
          git push origin main
        env:
          G_TOKEN: ${{ secrets.G_TOKEN }}